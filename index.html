<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concord live demo</title>
<meta name="description" content="Concord: turn a clinical trial protocol into a site budget both sides can check.">
<style>
  :root { --bg: #F4F7F9; --ink: #14212B; --muted: #5A6975; --accent: #0E7AA8; --rule: #DCE3E8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F171D; --ink: #E6EDF2; --muted: #9AA8B3; --accent: #4DB3DE; --rule: #24323C; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg);
         color: var(--ink); font: 16px/1.55 "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 34rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .4rem; letter-spacing: -.01em; }
  p { margin: .5rem 0; }
  .muted { color: var(--muted); font-size: .92rem; }
  a { color: var(--accent); }
  .bar { height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; margin: 1rem 0; }
  .bar i { display: block; height: 100%; width: 35%; background: var(--accent); border-radius: 2px; animation: s 1.1s ease-in-out infinite; }
  @keyframes s { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  .off .bar { display: none; }
</style>
</head>
<body>
<main id="m">
  <h1>Concord</h1>
  <p>Turn a clinical trial protocol into a site budget both sides can check.</p>
  <div class="bar"><i></i></div>
  <p id="msg">Opening the live demo…</p>
  <p class="muted">The live demo runs from the team's laptop during judging. Code:
    <a href="https://github.com/CosmicOdyssey/concord">github.com/CosmicOdyssey/concord</a></p>
</main>
<script>
(function () {
  var msg = document.getElementById('msg');
  function offline() {
    document.getElementById('m').className = 'off';
    msg.textContent = 'The live demo is offline right now. Please try again in a few minutes.';
  }
  fetch('tunnel.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.url) return offline();
      var done = false;
      var timer = setTimeout(function () { if (!done) { done = true; offline(); } }, 12000);
      // Reachability check before forwarding; an unreachable tunnel fails here instead of showing a browser error.
      fetch(d.url + '/api/health?t=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
        .then(function () { if (!done) { done = true; clearTimeout(timer); location.replace(d.url + '/' + location.hash); } })
        .catch(function () { if (!done) { done = true; clearTimeout(timer); offline(); } });
    })
    .catch(offline);
})();
</script>
</body>
</html>
