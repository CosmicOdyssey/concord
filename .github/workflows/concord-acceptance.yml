name: Concord acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Backend tests with data-dependent skip reasons
        run: python -m pytest -q -rs backend/tests
      - name: Frontend contracts (financial, portfolio, demo and sponsor boundaries)
        run: npm --prefix frontend test
      - name: Existing comparison contracts
        run: npm --prefix frontend run test:compare
      - name: Typecheck and build
        run: npm --prefix frontend run build
      - name: Lint
        run: npm --prefix frontend run lint
